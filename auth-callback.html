<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- SECURITY: CSP, MIME-type, and referrer headers. 'unsafe-inline' in script-src is required
     by the current inline-script architecture; migrate to nonces in Phase 8 build pipeline. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src https://fonts.gstatic.com; img-src 'self' https://placehold.co https://mhauftulhvnguualfcfw.supabase.co data: blob:; connect-src 'self' https://mhauftulhvnguualfcfw.supabase.co http://localhost:3001; frame-ancestors 'none'; object-src 'none'; base-uri 'self';">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
<title>Signing you in — Students in Business</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #0d1117;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: #fff;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    padding: 48px 40px;
    max-width: 440px;
    width: 100%;
    text-align: center;
    color: #0d1117;
    box-shadow: 0 32px 80px rgba(0,0,0,0.4);
  }
  .logo {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 32px;
  }
  .logo-mark {
    width: 38px; height: 38px;
    background: #0d1117;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; color: #fff; letter-spacing: -0.02em;
  }
  .logo-name { font-size: 15px; font-weight: 700; color: #0d1117; letter-spacing: -0.01em; }

  /* Loading state */
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid #e5e7eb;
    border-top-color: #0d1117;
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
    margin: 0 auto 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .state-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.02em; }
  .state-sub { font-size: 14px; color: #6b7280; line-height: 1.5; }

  /* Role picker */
  .role-heading { font-size: 20px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.02em; }
  .role-sub { font-size: 14px; color: #6b7280; margin-bottom: 24px; line-height: 1.5; }
  .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .role-card {
    border: 2px solid #e5e7eb;
    border-radius: 14px;
    padding: 20px 16px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    text-align: center;
  }
  .role-card:hover { border-color: #0d1117; }
  .role-card.selected { border-color: #0d1117; background: #f8fafc; }
  .role-icon { font-size: 26px; margin-bottom: 10px; }
  .role-name { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
  .role-desc { font-size: 12px; color: #9ca3af; line-height: 1.4; }
  .btn-confirm {
    width: 100%;
    padding: 14px;
    background: #0d1117;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    border: none;
    border-radius: 11px;
    cursor: pointer;
    letter-spacing: -0.01em;
    transition: opacity 0.15s;
  }
  .btn-confirm:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-confirm:not(:disabled):hover { opacity: 0.85; }

  /* Error state */
  .error-icon {
    width: 48px; height: 48px;
    background: #fef2f2;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
    font-size: 22px;
  }
  .btn-back {
    margin-top: 16px;
    display: inline-block;
    font-size: 13px;
    font-weight: 600;
    color: #6b7280;
    cursor: pointer;
    text-decoration: underline;
    background: none;
    border: none;
  }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="logo">
    <div class="logo-mark">SiB</div>
    <span class="logo-name">Students in Business</span>
  </div>
  <div id="stateLoading">
    <div class="spinner"></div>
    <div class="state-title">Signing you in…</div>
    <div class="state-sub">Just a moment while we set up your account.</div>
  </div>
</div>

<!-- CDN loaded synchronously so window._supabase is ready before the inline script runs -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(async function () {
  function showError(msg) {
    document.getElementById('stateLoading').innerHTML = `
      <div class="error-icon">✕</div>
      <div class="state-title">Something went wrong</div>
      <div class="state-sub">${msg}</div>
      <button class="btn-back" onclick="window.location.href='index.html'">← Back to home</button>`;
  }

  // Subpath-aware callback URL — mirrors auth.js _authCallbackUrl() so resends
  // from this page land back here on both GitHub Pages (/SiB/) and localhost.
  function callbackUrl() {
    return window.location.origin + window.location.pathname.replace(/[^/]*$/, '') + 'auth-callback.html';
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // Clean, on-brand error state for expired/invalid links, with a working resend form.
  function showLinkError(title, msg, prefillEmail) {
    document.getElementById('stateLoading').innerHTML = `
      <div class="error-icon">✕</div>
      <div class="state-title">${escapeHtml(title)}</div>
      <div class="state-sub" style="margin-bottom:20px;">${escapeHtml(msg)}</div>
      <input id="resendEmail" type="email" placeholder="you@example.com"
        value="${escapeHtml(prefillEmail || '')}"
        style="width:100%;padding:12px 14px;border:2px solid #e5e7eb;border-radius:11px;font-size:14px;
               font-family:inherit;margin-bottom:10px;outline:none;" />
      <button class="btn-confirm" id="resendBtn" onclick="doResend()">Resend verification email</button>
      <div id="resendMsg" style="font-size:13px;color:#6b7280;margin-top:12px;min-height:18px;"></div>
      <button class="btn-back" onclick="window.location.href='index.html'">← Back to home</button>`;
  }

  window.doResend = async function () {
    const input = document.getElementById('resendEmail');
    const btn   = document.getElementById('resendBtn');
    const out   = document.getElementById('resendMsg');
    const email = (input.value || '').trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      out.style.color = '#dc2626';
      out.textContent = 'Please enter a valid email address.';
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Sending…';
    out.textContent = '';
    try {
      const { error } = await window._supabase.auth.resend({
        type: 'signup',
        email,
        options: { emailRedirectTo: callbackUrl() }
      });
      if (error) {
        out.style.color = '#dc2626';
        out.textContent = error.message || 'Could not resend. Please try again.';
        btn.disabled = false;
        btn.textContent = 'Resend verification email';
        return;
      }
      out.style.color = '#16a34a';
      out.textContent = '✓ Sent. Check your inbox (and spam folder).';
      btn.textContent = 'Email sent';
    } catch (e) {
      out.style.color = '#dc2626';
      out.textContent = 'Could not resend. Please try again.';
      btn.disabled = false;
      btn.textContent = 'Resend verification email';
    }
  };

  // Reads error/auth params from BOTH the query string and the URL hash fragment.
  function readParams() {
    const out = {};
    const q = new URLSearchParams(window.location.search);
    q.forEach((v, k) => { out[k] = v; });
    const h = window.location.hash.startsWith('#') ? window.location.hash.slice(1) : window.location.hash;
    const hp = new URLSearchParams(h);
    hp.forEach((v, k) => { if (out[k] == null) out[k] = v; });
    return out;
  }

  // Maps a Supabase auth user to the SiB user shape.
  function _userFromSupabase(su) {
    const m     = su.user_metadata || {};
    const first = m.first_name || (m.full_name || '').split(' ')[0] || '';
    const last  = m.last_name  || (m.full_name || '').split(' ').slice(1).join(' ') || '';
    return {
      id:    su.id,
      name:  m.full_name || [first, last].filter(Boolean).join(' '),
      first,
      email: su.email,
      role:  m.role || null,  // null signals that role selection is still needed
      emailVerified:              true,  // Google OAuth verifies email
      emailVerificationToken:     null,
      emailVerificationExpiresAt: null,
      notificationPreferences: {
        signupConfirm: 'immediate', newApplication: 'immediate',
        applicationStatus: 'immediate', newListing: 'immediate', newMessage: 'immediate'
      },
      createdAt:           su.created_at || new Date().toISOString(),
      domainVerified:      true,
      coordinatorApproved: false,
    };
  }

  function completeLogin(user, token) {
    localStorage.setItem('sib_user', JSON.stringify(user));
    if (token) localStorage.setItem('sib_token', token);
    const redirect = sessionStorage.getItem('sib_auth_redirect');
    const target   = sessionStorage.getItem('sib_auth_target');
    sessionStorage.removeItem('sib_auth_redirect');
    sessionStorage.removeItem('sib_auth_target');
    if (redirect) { window.location.href = redirect; return; }
    if (target)   { window.location.href = target + '.html'; return; }
    // Role-based landing for a freshly confirmed/authenticated account.
    if (user.role === 'coordinator') { window.location.href = 'coordinator-dashboard.html'; return; }
    if (user.role === 'employer')    { window.location.href = 'dashboard-employer.html';    return; }
    if (user.role === 'student')     { window.location.href = 'dashboard-student.html';      return; }
    // Unknown role and no picker resolution — land signed-in on the home page.
    window.location.href = 'index.html';
  }

  // —— Role selection UI ——
  let _pendingSession = null;
  let _selectedRole   = null;

  function showRolePicker(session, user) {
    _pendingSession = session;
    document.getElementById('stateLoading').innerHTML = `
      <div class="role-heading">One last step</div>
      <div class="role-sub">Welcome, ${user.first || 'there'}! How will you be using SiB?</div>
      <div class="role-grid">
        <div class="role-card" id="roleStudent" onclick="pickRole('student')">
          <div class="role-icon">🎓</div>
          <div class="role-name">Student</div>
          <div class="role-desc">Grade 10–12, co-op applicant</div>
        </div>
        <div class="role-card" id="roleEmployer" onclick="pickRole('employer')">
          <div class="role-icon">🏢</div>
          <div class="role-name">Employer</div>
          <div class="role-desc">Company looking to host a student</div>
        </div>
      </div>
      <button class="btn-confirm" id="confirmBtn" onclick="confirmRole()" disabled>Continue →</button>`;
  }

  window.pickRole = function (role) {
    _selectedRole = role;
    document.getElementById('roleStudent').classList.toggle('selected', role === 'student');
    document.getElementById('roleEmployer').classList.toggle('selected', role === 'employer');
    document.getElementById('confirmBtn').disabled = false;
  };

  window.confirmRole = async function () {
    const btn = document.getElementById('confirmBtn');
    btn.disabled = true;
    btn.textContent = 'Setting up your account…';
    try {
      const { data, error } = await window._supabase.auth.updateUser({ data: { role: _selectedRole } });
      if (error) { showError(error.message || 'Setup failed. Please try again.'); return; }
      completeLogin(_userFromSupabase(data.user), _pendingSession.access_token);
    } catch (e) {
      showError('An unexpected error occurred.');
    }
  };

  // —— Main flow ——
  const sb = window._supabase;
  if (!sb) {
    showError('Auth service failed to initialize. Please try again.');
    return;
  }

  const params = readParams();

  // 1) Error fragments first (e.g. #error=access_denied&error_code=otp_expired&error_description=...).
  //    These arrive as hash OR query params and would otherwise leave a raw error in the URL.
  if (params.error || params.error_code || params.error_description) {
    const code = params.error_code || params.error || '';
    const desc = (params.error_description || '').replace(/\+/g, ' ');
    if (code === 'otp_expired' || /expired/i.test(desc)) {
      showLinkError(
        'This link has expired',
        'Verification links are valid for a limited time. Enter your email below and we’ll send a fresh one.'
      );
    } else if (code === 'access_denied') {
      showLinkError(
        'This link is no longer valid',
        desc || 'The link may have already been used or was cancelled. Request a new verification email below.'
      );
    } else {
      showLinkError(
        'We couldn’t confirm your email',
        desc || 'Something went wrong confirming your email. Request a new verification link below.'
      );
    }
    return;
  }

  // 2) PKCE flow: a ?code= is present and must be exchanged for a session.
  //    The client (detectSessionInUrl) may have already auto-exchanged it, in which
  //    case this errors with "code already used" — so on failure we fall through to
  //    getSession() rather than erroring, and only surface an error if no session exists.
  if (params.code) {
    try {
      const { data, error } = await sb.auth.exchangeCodeForSession(params.code);
      if (!error && data && data.session) { routeSession(data.session); return; }
    } catch (e) {
      // Fall through to getSession().
    }
  }

  // 3) Legacy hash-token flow: #access_token=...&refresh_token=...
  if (params.access_token && params.refresh_token) {
    try {
      const { data, error } = await sb.auth.setSession({
        access_token:  params.access_token,
        refresh_token: params.refresh_token
      });
      if (!error && data && data.session) { routeSession(data.session); return; }
    } catch (e) {
      // Fall through to getSession().
    }
  }

  // 4) Fallback: the client may have auto-detected the session from the URL on init.
  const { data: { session }, error: sessionError } = await sb.auth.getSession();
  if (sessionError || !session) {
    showLinkError(
      'No active sign-in found',
      sessionError?.message ||
        'This confirmation link may have expired or already been used. Enter your email to get a new one.'
    );
    return;
  }
  routeSession(session);

  function routeSession(session) {
    localStorage.setItem('sib_token', session.access_token);
    const user = _userFromSupabase(session.user);
    if (!user.role) {
      showRolePicker(session, user);
    } else {
      completeLogin(user, session.access_token);
    }
  }
})();
</script>
</body>
</html>
